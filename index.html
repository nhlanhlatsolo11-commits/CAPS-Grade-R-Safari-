<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAPS Grade R Safari Express</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2e7d32; --primary-dark: #1b5e20; --primary-light: #4caf50; --sec: #ff9800; --bg: #f4f9f4; --card: #ffffff; --text: #1e293b; --rad: 18px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(180deg, #e0f2fe 0%, #f4f9f4 25%, #e8f5e9 100%); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 1.5rem; overflow-x: hidden; }
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }
        header { background: linear-gradient(135deg, #1b5e20, #388e3c, #4caf50); color: #fff; padding: 1rem; text-align: center; box-shadow: 0 6px 15px rgba(27,94,32,0.2); border-bottom: 4px solid #ffc107; }
        header h1 { font-size: 1.7rem; text-shadow: 1px 2px 0 rgba(0,0,0,0.2); }
        header p { font-size: 0.9rem; opacity: 0.95; }
        .animal-bar { background: #fff; border-radius: var(--rad); margin: -0.8rem 0.8rem 0; padding: 0.6rem; box-shadow: 0 8px 20px rgba(0,0,0,0.08); border: 3px solid #ffecb3; text-align: center; }
        .animal-bar-title { font-size: 0.8rem; font-weight: 700; color: #d97706; text-transform: uppercase; margin-bottom: 0.2rem; }
        .animal-flex { display: flex; justify-content: space-around; max-width: 450px; margin: 0 auto; }
        .anim-btn { background: none; border: none; font-size: 2.3rem; cursor: pointer; transition: transform 0.2s; outline: none; }
        .anim-btn:active { transform: scale(1.3) rotate(10deg); }
        .score-banner { background: #fff8e1; border-bottom: 3px solid #ffe082; padding: 0.6rem 0.8rem; display: flex; justify-content: space-around; font-weight: 700; font-size: 1rem; color: #b45309; }
        .score-badge { background: #fff; padding: 0.35rem 0.9rem; border-radius: 20px; border: 2.5px solid #f59e0b; }
        .nav-tabs { display: flex; justify-content: center; gap: 0.4rem; background: rgba(232,245,233,0.95); padding: 0.6rem 0.4rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #c8e6c9; }
        .tab-btn { background: #fff; border: 2.5px solid var(--primary-light); color: var(--primary-dark); padding: 0.5rem 0.8rem; border-radius: 20px; font-size: 0.88rem; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 var(--primary-light); outline: none; }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border-color: var(--primary-dark); box-shadow: 0 3px 0 var(--primary-dark); }
        main { flex: 1; max-width: 800px; width: 100%; margin: 1rem auto; padding: 0 0.8rem; }
        .subject-section { display: none; }
        .subject-section.active { display: block; }
        .card { background: var(--card); border-radius: var(--rad); padding: 1.1rem; margin-bottom: 1.1rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 2.5px solid #e2e8f0; }
        .card h2 { color: var(--primary-dark); margin-bottom: 0.4rem; font-size: 1.2rem; }
        .prompt-box { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; background: #f8fafc; padding: 0.7rem 0.8rem; border-radius: 12px; border-left: 4px solid var(--sec); margin-bottom: 0.9rem; }
        .prompt-txt { font-size: 1.05rem; color: #334155; font-weight: 600; flex: 1; }
        .speak-btn { background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: #fff; border-radius: 10px; padding: 0.45rem 0.75rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #075985; flex-shrink: 0; }
        .speak-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #075985; }
        .grid-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.6rem; }
        .opt-btn { background: #fff; border: 2.5px solid #cbd5e1; border-radius: 12px; padding: 0.75rem 0.4rem; font-size: 1.15rem; font-weight: 700; color: #1e293b; cursor: pointer; text-align: center; box-shadow: 0 4px 0 #cbd5e1; outline: none; min-height: 52px; display: flex; align-items: center; justify-content: center; }
        .opt-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #cbd5e1; }
        .opt-btn.correct-btn { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; box-shadow: 0 4px 0 #16a34a !important; }
        .opt-btn.wrong-btn { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; box-shadow: 0 4px 0 #dc2626 !important; }
        .fb { margin-top: 0.8rem; padding: 0.7rem; border-radius: 10px; font-weight: 700; text-align: center; display: none; font-size: 1rem; }
        .fb.correct { display: block; background: #d1fae5; color: #065f46; border: 2px solid #34d399; }
        .fb.incorrect { display: block; background: #ffe4e6; color: #9f1239; border: 2px solid #f87171; }
        .code-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 250px; margin: 0.6rem auto; background: #f0f9ff; padding: 8px; border-radius: 14px; border: 2.5px solid #bae6fd; }
        .cell { aspect-ratio: 1; background: #fff; border: 2.5px dashed #7dd3fc; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .ctrls { display: flex; justify-content: center; gap: 0.5rem; }
        .ctrl-btn { background: var(--sec); color: #fff; border: none; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; box-shadow: 0 3px 0 #b45309; }
        footer { text-align: center; padding: 1rem; font-size: 0.82rem; color: #475569; background: #e8f5e9; border-top: 2px solid #c8e6c9; margin-top: auto; }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <header>
        <h1>🦁 CAPS Grade R Safari Express</h1>
        <p>Interactive Foundation Phase Learning Application</p>
    </header>

    <div class="animal-bar">
        <div class="animal-bar-title">👇 Tap an animal to hear them speak!</div>
        <div class="animal-flex">
            <button class="anim-btn" onclick="tapAnimal('lion')">🦁</button>
            <button class="anim-btn" onclick="tapAnimal('elephant')">🐘</button>
            <button class="anim-btn" onclick="tapAnimal('giraffe')">🦒</button>
            <button class="anim-btn" onclick="tapAnimal('zebra')">🦓</button>
            <button class="anim-btn" onclick="tapAnimal('monkey')">🐒</button>
        </div>
    </div>

    <div class="score-banner">
        <div class="score-badge">⭐ Stars: <span id="star-count">0</span></div>
        <div class="score-badge">🏆 Rank: <span id="rank-badge">Safari Explorer 🦁</span></div>
    </div>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="tab('maths', this)">🔢 Mathematics (12)</button>
        <button class="tab-btn" onclick="tab('phonics', this)">🔤 Language (12)</button>
        <button class="tab-btn" onclick="tab('lifeskills', this)">🎨 Life Skills (12)</button>
        <button class="tab-btn" onclick="tab('coding', this)">🤖 Coding & Robotics (12)</button>
    </nav>

    <main>
        <section id="maths" class="subject-section active"></section>
        <section id="phonics" class="subject-section"></section>
        <section id="lifeskills" class="subject-section"></section>
        <section id="coding" class="subject-section"></section>
    </main>

    <footer>
        <p>CAPS Grade R Safari Express &bull; Aligned with South African ECD Standards</p>
    </footer>

    <script>
        var stars = 0, rPos = 0, saVoice = null;

        function loadVoices() {
            if ('speechSynthesis' in window) {
                var v = window.speechSynthesis.getVoices();
                saVoice = v.find(function(x) { return x.lang === 'en-ZA' || x.lang.includes('ZA') || x.name.includes('South Africa'); }) || v.find(function(x) { return x.lang.startsWith('en'); });
            }
        }
        if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }

        function speakText(t) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}]/gu, ''));
                u.lang = 'en-ZA'; u.rate = 0.85; u.pitch = 1.1;
                if (saVoice) u.voice = saVoice;
                window.speechSynthesis.speak(u);
            }
        }

        function playAudioFx(type) {
            try {
                var Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                var ctx = new Ctx(); if (ctx.state === 'suspended') ctx.resume();
                var now = ctx.currentTime;
                if (type === 'lion') {
                    var o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(130, now); o.frequency.linearRampToValueAtTime(50, now + 0.8);
                    g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                    o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.8);
                } else if (type === 'correct') {
                    [523, 659, 783, 1046].forEach(function(f, i) {
                        var o = ctx.createOscillator(), g = ctx.createGain(), st = now + (i * 0.08);
                        o.type = 'triangle'; o.frequency.setValueAtTime(f, st);
                        g.gain.setValueAtTime(0.2, st); g.gain.exponentialRampToValueAtTime(0.01, st + 0.25);
                        o.connect(g); g.connect(ctx.destination); o.start(st); o.stop(st + 0.25);
                    });
                } else if (type === 'wrong') {
                    var o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now); o.frequency.exponentialRampToValueAtTime(80, now + 0.25);
                    g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now + 0.25);
                }
            } catch (e) {}
        }

        function tapAnimal(a) {
            playAudioFx('lion');
            var m = { lion: "I am the brave Lion! Roar!", elephant: "I am the giant Elephant!", giraffe: "I am the tall Giraffe!", zebra: "I am the speedy Zebra!", monkey: "I am the cheeky Monkey!" };
            if (m[a]) speakText(m[a]);
        }

        function fireConfetti() {
            var c = document.getElementById('confetti-canvas'); if (!c) return;
            var ctx = c.getContext('2d'); c.width = window.innerWidth; c.height = window.innerHeight;
            var p = []; var clr = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
            for (var i = 0; i < 40; i++) p.push({ x: c.width / 2, y: c.height / 2, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.7) * 10, size: Math.random() * 8 + 4, color: clr[Math.floor(Math.random() * clr.length)] });
            function anim() {
                ctx.clearRect(0, 0, c.width, c.height); var act = false;
                p.forEach(function(k) { k.x += k.vx; k.y += k.vy; k.vy += 0.3; if (k.y < c.height) act = true; ctx.fillStyle = k.color; ctx.fillRect(k.x, k.y, k.size, k.size); });
                if (act) requestAnimationFrame(anim); else ctx.clearRect(0, 0, c.width, c.height);
            }
            anim();
        }

        var data = {
            maths: [
                ["1. Counting Lions","How many lions do you see? 🦁 🦁 🦁",["2","3","5"],1],
                ["2. Shape Recognition","Which 2D shape matches the round sun? ☀️",["🔴 Circle","🟦 Square","🔺 Triangle"],0],
                ["3. Patterns & Sequence","Complete the pattern: Apple, Banana, Apple, Banana, what comes next? 🍎 🍌 🍎 🍌 ❓",["🍎 Apple","🍌 Banana","🍇 Grapes"],0],
                ["4. Size Comparison","Which animal is bigger? Elephant or Ant? 🐘 vs 🐜",["🐘 Elephant","🐜 Ant"],0],
                ["5. More or Less","Which group has more objects? 5 Blue dots or 2 Red dots? 🔵🔵🔵🔵🔵 vs 🔴🔴",["🔵 5 Blue Dots","🔴 2 Red Dots"],0],
                ["6. Spatial Position","Where is the bird perched? On the tree or under the tree? 🐦 🌳",["ON the tree","UNDER the tree"],0],
                ["7. Number Recognition","Which symbol is the number FOUR?",["2","4","7"],1],
                ["8. Matching Sets","Which number matches two apples? 🍎 🍎",["1","2","3"],1],
                ["9. Height Comparison","Which animal is taller? Giraffe or Meerkat? 🦒 vs 🦦",["🦒 Giraffe","🦦 Meerkat"],0],
                ["10. 3D Objects","What 3D shape is a round soccer ball? ⚽",["⚽ Sphere","📦 Cube"],0],
                ["11. Early Addition","1 monkey plus 1 monkey equals how many monkeys? 🐒 + 🐒",["1","2","3"],1],
                ["12. Time & Day Sequence","When do we sleep at night under the stars? 🌙",["Night Time 🌙","Day Time ☀️"],0]
            ],
            phonics: [
                ["1. Initial Sound /s/","What sound does Sun start with? ☀️",["/s/ (S)","/b/ (B)","/m/ (M)"],0],
                ["2. Initial Sound /a/","What sound does Apple start with? 🍎",["/a/ (A)","/t/ (T)","/p/ (P)"],0],
                ["3. Initial Sound /t/","What sound does Tiger start with? 🐅",["/t/ (T)","/d/ (D)","/s/ (S)"],0],
                ["4. Rhyming Words (Cat)","Which word rhymes with Cat? 🐱",["Hat 🎩","Dog 🐶","Fish 🐟"],0],
                ["5. Rhyming Words (Sun)","Which word rhymes with Sun? ☀️",["Run 🏃","Tree 🌳","Car 🚗"],0],
                ["6. Animal Sounds","Which animal makes a loud ROAR?",["🦁 Lion","🐸 Frog","🐥 Duck"],0],
                ["7. Vocabulary","What safari animal has a very long neck? 🦒",["🦒 Giraffe","🦛 Hippo","Zebra 🦓"],0],
                ["8. Syllable Clapping","Clap the word Sa-fa-ri. How many claps?",["1 Clap","2 Claps","3 Claps"],2],
                ["9. Opposites","What is the opposite of HOT ☀️?",["🧊 Cold","🔥 Warm"],0],
                ["10. Story Sequence","What comes first when growing a sunflower? 🌻",["🌱 Plant Seed","🌻 Pick Flower"],0],
                ["11. Listening Discrimination","Which animal word starts with /m/?",["🐒 Monkey","🐘 Elephant"],0],
                ["12. Letter Matching","Match lowercase letter a with its uppercase letter:",["A","B","M"],0]
            ],
            lifeskills: [
                ["1. Personal Hygiene","What must we do before eating food? 🍎",["🧼 Wash Hands","😴 Go to Sleep"],0],
                ["2. Road Safety","What does a RED traffic light signal tell us to do? 🚦",["🛑 Stop","🏃 Run"],0],
                ["3. Healthy Eating","Which snack is healthy for our body? 🍎 vs 🍬",["🍎 Fresh Apple","🍬 Sweet Candy"],0],
                ["4. Body Awareness","Which body part do we use to see safari animals? 👀",["👀 Eyes","👂 Ears"],0],
                ["5. Identifying Emotions","How is this happy friend feeling? 😊",["😊 Happy","😢 Sad"],0],
                ["6. Weather Awareness","What should we wear when it is raining? 🌧️",["🧥 Raincoat","🩳 Swimsuit"],0],
                ["7. Environment Care","Where do we throw empty sweet wrappers? 🗑️",["🗑️ In Dustbin","🌿 On Ground"],0],
                ["8. Water Safety","What must you wear when playing near deep water? 🏊",["🤿 Life Jacket","Heavy Shoes"],0],
                ["9. Community Helpers","Who puts out dangerous fires? 🧑‍🚒",["🧑‍🚒 Firefighter","👨‍🍳 Chef"],0],
                ["10. Good Manners","When someone gives you a gift, what polite words do you say?",["Thank You!","No way!"],0],
                ["11. Four Seasons","In which season do colorful flowers bloom? 🌸",["🌸 Spring","❄️ Winter"],0],
                ["12. Animal Welfare","How should we treat safari animals and pets? 🐾",["❤️ Gently & Kind","Roughly"],0]
            ],
            coding: [
                ["1. Grid Navigation","Guide Rover 🤖 step-by-step to reach Zebra 🦓!",null,-1],
                ["2. Sequence & Order","Which step comes FIRST in a robot instruction list?",["🟢 Start Power On","🔴 Stop"],0],
                ["3. Directional Symbols","Which arrow points to the RIGHT direction?",["➡️ Right","⬅️ Left","⬆️ Up"],0],
                ["4. Debugging","The robot got stuck on a rock 🪨! Fixing code is called...",["🐛 Debugging","Sleeping"],0],
                ["5. Repeat / Loops","To move 2 steps forward without repeating code, use a...",["🔁 Loop","Break"],0],
                ["6. Inputs & Outputs","Pressing a switch 🔘 turns on a light 💡. The switch is an...",["📥 Input","📤 Output"],0],
                ["7. Sorting Algorithms","Where should the RED coding card go? 🔴",["🔴 Red Box","🔵 Blue Box"],0],
                ["8. Spatial Orientation","Where is the sun ☀️ located on the grid screen?",["⬆️ Top Corner","⬇️ Bottom Corner"],0],
                ["9. Algorithm Steps","Step-by-step instructions are called an...",["📋 Algorithm","Mistake"],0],
                ["10. Binary Logic","What binary number usually means ON in robotics?",["1 (ON)","0 (OFF)"],0],
                ["11. Obstacle Avoidance","A river is in front of Rover 🤖! Which command avoids danger?",["↪️ Turn Around","➡️ Drive Forward"],0],
                ["12. Mission Completion","All 12 coding tasks finished! What does the Rover reach? ⛺",["⛺ Safari Camp!","Lost Forest"],0]
            ]
        };

        function buildUI() {
            for (var sub in data) {
                var sec = document.getElementById(sub); var h = '';
                data[sub].forEach(function(a, i) {
                    h += '<div class="card"><h2>' + a[0] + '</h2>';
                    h += '<div class="prompt-box"><p class="prompt-txt">' + a[1] + '</p>';
                    h += '<button class="speak-btn" onclick="speakText(\'' + a[1].replace(/'/g, "\\'") + '\')">🔊 Listen</button></div>';

                    if (a[3] === -1) {
                        h += '<div class="code-grid"><div class="cell" id="c-0">🤖</div><div class="cell" id="c-1"></div><div class="cell" id="c-2">🦓</div></div>';
                        h += '<div class="ctrls"><button class="ctrl-btn" onclick="mvBot()">Move Right ➡️</button><button class="ctrl-btn" style="background:#64748b;" onclick="rstBot()">Reset 🔄</button></div><div id="g-fb" class="fb"></div>';
                    } else {
                        var id = sub + '-' + i;
                        h += '<div class="grid-opts">';
                        a[2].forEach(function(opt, oi) {
                            h += '<button class="opt-btn" onclick="chk(this,' + (oi === a[3]) + ',\'' + id + '\')">' + opt + '</button>';
                        });
                        h += '</div><div id="' + id + '-fb" class="fb"></div>';
                    }
                    h += '</div>';
                });
                sec.innerHTML = h;
            }
        }

        function tab(id, btn) {
            var s = document.getElementsByClassName('subject-section'), b = document.getElementsByClassName('tab-btn');
            for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
            for (var j = 0; j < b.length; j++) b[j].classList.remove('active');
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function chk(btn, isC, id) {
            var fb = document.getElementById(id + '-fb');
            var siblings = btn.parentElement.getElementsByClassName('opt-btn');
            for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('correct-btn', 'wrong-btn');

            if (isC) {
                btn.classList.add('correct-btn');
                if (fb) { fb.className = "fb correct"; fb.innerHTML = "🌟 Excelled! Correct Answer!"; }
                playAudioFx('correct'); speakText("Excelled! That is correct!"); fireConfetti();
                if (btn.getAttribute('data-scored') !== 'true') {
                    stars++; btn.setAttribute('data-scored', 'true');
                    document.getElementById('star-count').innerText = stars; updRank();
                }
            } else {
                btn.classList.add('wrong-btn');
                if (fb) { fb.className = "fb incorrect"; fb.innerHTML = "❌ Try again!"; }
                playAudioFx('wrong'); speakText("Not quite. Give it another try!");
            }
        }

        function updRank() {
            var r = document.getElementById('rank-badge');
            if (stars >= 30) r.innerText = "Safari Master 👑";
            else if (stars >= 15) r.innerText = "Safari Champion 🏆";
            else if (stars >= 5) r.innerText = "Junior Guide 🌿";
            else r.innerText = "Safari Explorer 🦁";
        }

        function mvBot() {
            var fb = document.getElementById('g-fb');
            if (rPos < 2) {
                document.getElementById('c-' + rPos).innerText = ''; rPos++;
                document.getElementById('c-' + rPos).innerText = '🤖';
                if (rPos === 2) {
                    if (fb) { fb.className = "fb correct"; fb.innerHTML = "🎉 Fantastic! Rover reached the Zebra!"; }
                    playAudioFx('correct'); speakText("Fantastic coding! Rover reached the Zebra!"); fireConfetti();
                    stars += 2; document.getElementById('star-count').innerText = stars; updRank();
                }
            }
        }

        function rstBot() {
            document.getElementById('c-' + rPos).innerText = ''; rPos = 0;
            document.getElementById('c-0').innerText = '🤖'; document.getElementById('c-1').innerText = ''; document.getElementById('c-2').innerText = '🦓';
            var fb = document.getElementById('g-fb'); if (fb) fb.style.display = 'none';
        }

        buildUI();
    </script>
</body>
</html>

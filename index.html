<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CAPS Grade R Safari Express</title>
<meta name="theme-color" content="#ff7e5f">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2e7d32;--secondary:#ff9800;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Fredoka',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:#f4f9f4;color:#1e293b;display:flex;flex-direction:column;min-height:100vh;padding-bottom:2rem;}
header{background:linear-gradient(135deg,#ff512f 0%,#f09819 40%,#2e7d32 85%);color:#fff;padding:1.4rem 1rem;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);border-bottom-left-radius:24px;border-bottom-right-radius:24px;}
header h1{font-size:1.8rem;text-shadow:0 3px 6px rgba(0,0,0,.3);margin-bottom:.2rem;}
header p{font-size:.95rem;opacity:.95;text-shadow:0 1px 3px rgba(0,0,0,.2);}
.header-badge{background:rgba(255,255,255,.25);padding:.35rem 1rem;border-radius:20px;font-size:.85rem;font-weight:700;display:inline-block;margin-bottom:.5rem;border:1.5px solid rgba(255,255,255,.4);}
.animal-bar{display:flex;justify-content:center;gap:.7rem;margin-top:1rem;padding-top:.6rem;border-top:1px solid rgba(255,255,255,.3);}
.animal-btn{font-size:1.9rem;background:rgba(255,255,255,.95);border:3px solid #ffe082;border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);transition:transform .15s;}
.animal-btn:active{transform:scale(1.25) rotate(12deg);}
.score-banner{background:#fff8e1;border-bottom:3px solid #ffe082;padding:.7rem 1rem;display:flex;justify-content:space-around;font-weight:700;color:#e65100;font-size:1.05rem;align-items:center;}
.score-badge{background:#fff;padding:.35rem 1.1rem;border-radius:20px;border:2px solid #ffb74d;box-shadow:0 2px 4px rgba(0,0,0,.05);}
.level-toggle{display:flex;background:#ffe082;padding:.2rem;border-radius:20px;border:2px solid #f57c00;gap:.2rem;}
.lvl-btn{background:transparent;border:none;padding:.3rem .8rem;border-radius:16px;font-weight:700;cursor:pointer;color:#b45309;font-size:.85rem;}
.lvl-btn.active{background:#e65100;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.nav-tabs{display:flex;justify-content:center;gap:.4rem;background:#e8f5e9;padding:.8rem .5rem;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.tab-btn{background:#fff;border:2.5px solid #cbd5e1;padding:.55rem 1rem;border-radius:22px;font-weight:700;cursor:pointer;color:#475569;box-shadow:0 3px 0 #cbd5e1;font-size:.9rem;}
.tab-btn.active[data-tab="maths"]{background:#2e7d32;color:#fff;border-color:#1b5e20;box-shadow:0 3px 0 #1b5e20;}
.tab-btn.active[data-tab="phonics"]{background:#0284c7;color:#fff;border-color:#0369a1;box-shadow:0 3px 0 #0369a1;}
.tab-btn.active[data-tab="lifeskills"]{background:#d97706;color:#fff;border-color:#b45309;box-shadow:0 3px 0 #b45309;}
.tab-btn.active[data-tab="coding"]{background:#0d9488;color:#fff;border-color:#0f766e;box-shadow:0 3px 0 #0f766e;}
.tab-btn.active[data-tab="stories"]{background:#7c3aed;color:#fff;border-color:#6d28d9;box-shadow:0 3px 0 #6d28d9;}
main{flex:1;max-width:850px;width:100%;margin:1.2rem auto;padding:0 1rem;}
.subject-section{display:none;}
.subject-section.active{display:block;}
.card{background:#fff;border-radius:20px;padding:1.3rem;margin-bottom:1.4rem;box-shadow:0 6px 16px rgba(0,0,0,.06);border:2px solid #e2e8f0;}
.card h2{color:var(--primary);font-size:1.25rem;margin-bottom:.5rem;}
.prompt-box{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:1rem;}
.prompt{font-size:1.15rem;color:#334155;font-weight:600;line-height:1.4;}
.spk-btn{background:#e0f2fe;border:2px solid #0284c7;color:#0369a1;border-radius:14px;padding:.5rem .9rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #0284c7;white-space:nowrap;}
.spk-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0284c7;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.9rem;}
.opt-btn{background:#f8fafc;border:3px solid #cbd5e1;border-radius:16px;padding:1.1rem .5rem;font-size:1.25rem;font-weight:700;color:#1e293b;cursor:pointer;text-align:center;box-shadow:0 5px 0 #cbd5e1;display:flex;flex-direction:column;align-items:center;gap:.3rem;}
.opt-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cbd5e1;}
.opt-btn .pic-icon{font-size:2.4rem;display:block;}
.opt-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#15803d!important;box-shadow:0 5px 0 #16a34a!important;}
.opt-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#b91c1c!important;box-shadow:0 5px 0 #dc2626!important;}
.fb{margin-top:1rem;padding:.8rem;border-radius:12px;font-weight:700;text-align:center;display:none;font-size:1.05rem;}
.fb.correct{display:block;background:#d1fae5;color:#065f46;border:2px solid #a7f3d0;}
.fb.wrong{display:block;background:#ffe4e6;color:#9f1239;border:2px solid #fecdd3;}
.story-nav{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.8rem;margin-bottom:1rem;}
.story-tab-btn{background:#f3e8ff;border:2px solid #c084fc;color:#6b21a8;padding:.5rem 1rem;border-radius:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
.story-tab-btn.active{background:#7c3aed;color:#fff;border-color:#5b21b6;}
.story-panel{display:none;}
.story-panel.active{display:block;}
.story-box{background:#faf5ff;border:3px dashed #c084fc;border-radius:16px;padding:1.2rem;margin-bottom:1.2rem;}
.story-box h3{color:#6b21a8;font-size:1.2rem;margin-bottom:.5rem;}
.story-box p{font-size:1.1rem;color:#4a5568;line-height:1.6;margin-bottom:1rem;}
#c-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:999;}
footer{text-align:center;padding:1.4rem;font-size:.9rem;color:#475569;background:#e8f5e9;border-top:2px solid #c8e6c9;font-weight:600;}
</style>
</head>
<body>
<canvas id="c-canvas"></canvas>
<header>
<div class="header-badge">🇿🇦 CAPS SOUTH AFRICA ECD PORTAL</div>
<h1>Grade R Safari Express</h1>
<p>Term 1 Coding & Robotics, Maths, Phonics, Life Skills & Stories</p>
<div class="animal-bar">
<button class="animal-btn" onclick="tAnim('lion')">🦁</button>
<button class="animal-btn" onclick="tAnim('elephant')">🐘</button>
<button class="animal-btn" onclick="tAnim('giraffe')">🦒</button>
<button class="animal-btn" onclick="tAnim('zebra')">🦓</button>
<button class="animal-btn" onclick="tAnim('monkey')">🐒</button>
</div>
</header>
<div class="score-banner">
<div class="score-badge">⭐ Stars: <span id="s-cnt">0</span></div>
<div class="score-badge">🏆 Rank: <span id="r-bdg">Safari Explorer</span></div>
<div class="level-toggle">
<button id="btn-lvl1" class="lvl-btn active" onclick="setLvl(1)">Level 1</button>
<button id="btn-lvl2" class="lvl-btn" onclick="setLvl(2)">Level 2</button>
</div>
</div>
<nav class="nav-tabs">
<button class="tab-btn active" data-tab="maths" onclick="tab('maths',this)">🔢 Maths (30)</button>
<button class="tab-btn" data-tab="phonics" onclick="tab('phonics',this)">🔤 Phonics (30)</button>
<button class="tab-btn" data-tab="coding" onclick="tab('coding',this)">🤖 Coding &amp; Robotics (24)</button>
<button class="tab-btn" data-tab="lifeskills" onclick="tab('lifeskills',this)">🎨 Life Skills (24)</button>
<button class="tab-btn" data-tab="stories" onclick="tab('stories',this)">📖 Stories (50)</button>
</nav>
<main>
<section id="maths" class="subject-section active"></section>
<section id="phonics" class="subject-section"></section>
<section id="coding" class="subject-section"></section>
<section id="lifeskills" class="subject-section"></section>
<section id="stories" class="subject-section"></section>
</main>
<footer>CAPS Grade R Safari Express &bull; Developed by Nhlanhla Tsolo</footer>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){for(var r of regs){r.unregister();}});}
var stars=0,saV=null,curLvl=1;
function lV(){if('speechSynthesis'in window){var v=window.speechSynthesis.getVoices();saV=v.find(x=>x.lang==='en-ZA'||x.lang.includes('ZA'))||v.find(x=>x.lang.startsWith('en'));}}
if('speechSynthesis'in window){window.speechSynthesis.onvoiceschanged=lV;lV();}
function spk(t){if('speechSynthesis'in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}]/gu,''));u.lang='en-ZA';u.rate=0.82;if(saV)u.voice=saV;window.speechSynthesis.speak(u);}}
function tAnim(type){try{var ctx=new(window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);if(type==='lion'){o.frequency.setValueAtTime(120,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+.4);g.gain.setValueAtTime(.3,ctx.currentTime);o.start();o.stop(ctx.currentTime+.4);spk("Roar! I am a brave Safari Lion!");}else if(type==='elephant'){o.frequency.setValueAtTime(300,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(600,ctx.currentTime+.3);g.gain.setValueAtTime(.2,ctx.currentTime);o.start();o.stop(ctx.currentTime+.3);spk("I am a big Safari Elephant!");}else if(type==='giraffe')spk("I am a tall Safari Giraffe!");else if(type==='zebra')spk("I am a fast Safari Zebra!");else if(type==='monkey'){o.frequency.setValueAtTime(600,ctx.currentTime);g.gain.setValueAtTime(.2,ctx.currentTime);o.start();o.stop(ctx.currentTime+.2);spk("I am a playful Safari Monkey!");}}catch(e){}}
function confetti(){var c=document.getElementById('c-canvas'),x=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight;var p=[],cols=['#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6'];for(var i=0;i<35;i++)p.push({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10-3,s:Math.random()*7+3,c:cols[Math.floor(Math.random()*cols.length)]});var t=setInterval(()=>{x.clearRect(0,0,c.width,c.height);p.forEach(k=>{k.x+=k.vx;k.y+=k.vy;k.vy+=.2;x.fillStyle=k.c;x.fillRect(k.x,k.y,k.s,k.s);});},20);setTimeout(()=>{clearInterval(t);x.clearRect(0,0,c.width,c.height);},1000);}

var D1={
maths:[
{t:"1. Counting Lions",p:"How many lions do you see? 🦁 🦁 🦁",o:[{i:"2️⃣",l:"2"},{i:"3️⃣",l:"3"},{i:"5️⃣",l:"5"}],c:1},
{t:"2. Shape Recognition",p:"Which 2D shape matches Ali's round ball? ⚽",o:[{i:"🔴",l:"Circle"},{i:"🟦",l:"Square"},{i:"🔺",l:"Triangle"}],c:0},
{t:"3. Patterns & Sequence",p:"Complete pattern: Apple 🍎, Banana 🍌, Apple 🍎, Banana 🍌...",o:[{i:"🍌",l:"Banana"},{i:"🍎",l:"Apple"},{i:"🍇",l:"Grapes"}],c:1},
{t:"4. Size Comparison",p:"Which animal is BIGGER?",o:[{i:"🐜",l:"Ant"},{i:"🐘",l:"Elephant"},{i:"🐈",l:"Cat"}],c:1},
{t:"5. Counting Zebras",p:"How many zebras are drinking water? 🦓 🦓",o:[{i:"4️⃣",l:"4"},{i:"1️⃣",l:"1"},{i:"2️⃣",l:"2"}],c:2},
{t:"6. Number Match",p:"Find the number that matches 5 fingers 🖐️",o:[{i:"5️⃣",l:"5"},{i:"3️⃣",l:"3"},{i:"1️⃣",l:"1"}],c:0},
{t:"7. Height Comparison",p:"Which animal is TALLER?",o:[{i:"🐢",l:"Tortoise"},{i:"🦒",l:"Giraffe"},{i:"🐕",l:"Dog"}],c:1},
{t:"8. Length Comparison",p:"Which snake is LONGER? 🐍",o:[{i:"🐛",l:"Short Worm"},{i:"📏",l:"Long Snake"}],c:1},
{t:"9. Weight Comparison",p:"Which object is HEAVIER?",o:[{i:"🪶",l:"Light Feather"},{i:"🪨",l:"Big Rock"}],c:1},
{t:"10. Position: Inside & Outside",p:"Where is the dog? 🐶🏠",o:[{i:"🚪",l:"Inside House"},{i:"🌳",l:"Far Outside"}],c:0},
{t:"11. Position: Top & Bottom",p:"Which animal is at the TOP of the tree? 🐒🌴",o:[{i:"🌱",l:"Grass Bottom"},{i:"🐒",l:"Monkey on Top"}],c:1},
{t:"12. Sorting Colors",p:"Which object is YELLOW like the sun? ☀️",o:[{i:"🫐",l:"Blueberry"},{i:"🍋",l:"Lemon"},{i:"🔴",l:"Red Cherry"}],c:1},
{t:"13. Simple Addition",p:"1 Mealie seed plus 1 Mealie seed makes how many? 🌱 + 🌱",o:[{i:"3️⃣",l:"3 Seeds"},{i:"2️⃣",l:"2 Seeds"}],c:1},
{t:"14. Capacity",p:"Which container holds MORE water? 🪣 vs ☕",o:[{i:"☕",l:"Small Cup"},{i:"🪣",l:"Big Bucket"}],c:1},
{t:"15. Time & Routine",p:"When do we see the bright Sun and wake up? ☀️",o:[{i:"🌅",l:"Morning"},{i:"🌙",l:"Nighttime"}],c:0}
],
phonics:[
{t:"1. Sound /s/ (The Green Dress)",p:"What sound does Sun start with? ☀️",spkTxt:"What sound does Sun start with?",o:[{i:"🐝",l:"Sound /b/"},{i:"☀️",l:"Sound /s/"},{i:"🐒",l:"Sound /m/"}],c:1},
{t:"2. Sound /f/ (Run Lindi Run)",p:"What sound does Finish start with? 🏁",spkTxt:"What sound does Finish start with?",o:[{i:"🏁",l:"Sound /f/"},{i:"🐱",l:"Sound /c/"},{i:"🌳",l:"Sound /r/"}],c:0},
{t:"3. Sound /b/ (Ali and the Paint)",p:"What sound does Ball start with? ⚽",spkTxt:"What sound does Ball start with?",o:[{i:"☀️",l:"Sound /s/"},{i:"⚽",l:"Sound /b/"},{i:"🌊",l:"Sound /w/"}],c:1},
{t:"4. Sound /w/ (A Beautiful Day)",p:"What sound does Water start with? 💧",spkTxt:"What sound does Water start with?",o:[{i:"🍎",l:"Sound /a/"},{i:"🐅",l:"Sound /t/"},{i:"💧",l:"Sound /w/"}],c:2},
{t:"5. Sound /t/ (Teacher Akinyi)",p:"What sound does Teacher start with? 👩‍🏫",spkTxt:"What sound does Teacher start with?",o:[{i:"👩‍🏫",l:"Sound /t/"},{i:"🐒",l:"Sound /m/"},{i:"🚗",l:"Sound /r/"}],c:0},
{t:"6. Sound /a/ (Apple)",p:"What sound does Apple start with? 🍎",spkTxt:"What sound does Apple start with?",o:[{i:"🐍",l:"Sound /s/"},{i:"🍎",l:"Sound /a/"},{i:"⚽",l:"Sound /b/"}],c:1},
{t:"7. Sound /m/ (Monkey)",p:"What sound does Monkey start with? 🐒",spkTxt:"What sound does Monkey start with?",o:[{i:"🐒",l:"Sound /m/"},{i:"💧",l:"Sound /w/"},{i:"🏁",l:"Sound /f/"}],c:0},
{t:"8. Sound /p/ (Pig)",p:"What sound does Pig start with? 🐷",spkTxt:"What sound does Pig start with?",o:[{i:"☀️",l:"Sound /s/"},{i:"🐷",l:"Sound /p/"},{i:"👩‍🏫",l:"Sound /t/"}],c:1},
{t:"9. Rhyming Words",p:"Which word rhymes with CAT? 🐱",spkTxt:"Which word rhymes with CAT?",o:[{i:"🐶",l:"Dog"},{i:"🎩",l:"Hat"},{i:"🚗",l:"Car"}],c:1},
{t:"10. Beginning Sound",p:"Which picture starts with sound /d/ for Dog? 🐕",spkTxt:"Which picture starts with sound /d for dog?",o:[{i:"🍎",l:"Apple"},{i:"🐕",l:"Dog"},{i:"⚽",l:"Ball"}],c:1},
{t:"11. Syllable Clapping",p:"How many claps in ELEPHANT? 🐘",spkTxt:"How many claps in elephant? E-le-phant.",o:[{i:"1️⃣",l:"1 Clap"},{i:"3️⃣",l:"3 Claps"}],c:1},
{t:"12. Oral Vocabulary",p:"What do we use to listen to stories? 👂",spkTxt:"What do we use to listen to stories?",o:[{i:"👁️",l:"Eyes"},{i:"👂",l:"Ears"}],c:1},
{t:"13. Letter Recognition",p:"Find uppercase letter S 🔤",spkTxt:"Find uppercase letter S.",o:[{i:"🔤",l:"Letter S"},{i:"🔠",l:"Letter A"}],c:0},
{t:"14. Story Sequence",p:"What happened first when waking up? 🌅",spkTxt:"What happened first when waking up?",o:[{i:"🌙",l:"Go to sleep"},{i:"🛏️",l:"Get out of bed"}],c:1},
{t:"15. Sound /c/ (Cat)",p:"What sound does Cat start with? 🐈",spkTxt:"What sound does Cat start with?",o:[{i:"🐈",l:"Sound /c/"},{i:"💧",l:"Sound /w/"},{i:"☀️",l:"Sound /s/"}],c:0}
],
coding:[
{t:"1. Robotic Direction",p:"Program the Safari Rover to move FORWARD! ⬆️",spkTxt:"Program the Safari Rover to move forward!",o:[{i:"⬇️",l:"Backward Move"},{i:"⬆️",l:"Forward Move"}],c:1},
{t:"2. Unplugged Algorithm",p:"Which step comes FIRST when brushing teeth? 🦷",spkTxt:"Which step comes first when brushing teeth?",o:[{i:"🪥",l:"Put paste on brush"},{i:"😁",l:"Smile clean teeth"}],c:0},
{t:"3. Coding Turn",p:"Turn RIGHT to navigate around the thorn tree ➡️",spkTxt:"Turn right to navigate around the thorn tree.",o:[{i:"⬅️",l:"Turn Left"},{i:"➡️",l:"Turn Right"}],c:1},
{t:"4. Pattern Loops",p:"Complete the coding loop: 🔴 🔵 🔴 🔵...",spkTxt:"Complete the coding loop, red, blue, red, blue.",o:[{i:"🔵",l:"Blue Circle"},{i:"🔴",l:"Red Circle"}],c:0},
{t:"5. Bee-Bot Navigation",p:"Guide the Bee-Bot 2 steps FORWARD to the flower 🐝🌸",spkTxt:"Guide the Bee Bot 2 steps forward to the flower.",o:[{i:"⬇️⬇️",l:"Two Steps Down"},{i:"⬆️⬆️",l:"Two Steps Up"}],c:1},
{t:"6. Conditional Logic",p:"IF the traffic light is RED, what must the robot do? 🚦",spkTxt:"If the traffic light is red, what must the robot do?",o:[{i:"🛑",l:"Stop"},{i:"🚗",l:"Go Fast"}],c:0},
{t:"7. Step-by-Step Instructions",p:"What instruction comes first to make tea? ☕",spkTxt:"What instruction comes first to make tea?",o:[{i:"🧋",l:"Drink Tea"},{i:"🔥",l:"Boil Water"}],c:1},
{t:"8. Coding Debugging",p:"The robot went the wrong way! Which arrow reverses direction? 🔄",spkTxt:"Which arrow reverses direction?",o:[{i:"⬅️",l:"Left Arrow"},{i:"⬆️",l:"Forward Arrow"}],c:0},
{t:"9. Robot Body Movement",p:"Follow algorithm: 1. Clap hands 👏 2. Stomp feet 🦶 What is next?",spkTxt:"Follow algorithm: clap hands, stomp feet. What is next?",o:[{i:"😴",l:"Sleep"},{i:"🛷",l:"Spin Around"}],c:1},
{t:"10. Grid Navigation",p:"Move 1 step UP and 1 step RIGHT on the game mat 🗺️",spkTxt:"Move one step up and one step right on the game mat.",o:[{i:"↗️",l:"Diagonal Move"},{i:"⬇️",l:"Down Move"}],c:0},
{t:"11. Robot Sound Output",p:"What sound does our friendly classroom robot make when finishing a task? 🤖",spkTxt:"What sound does our friendly classroom robot make when finishing a task?",o:[{i:"🦁",l:"Roar"},{i:"🎵",l:"Beep Boop Bop"}],c:1},
{t:"12. Coding Sequence",p:"Arrange dressing in order: Put on shoes 👟 vs Put on socks 🧦. Which goes FIRST?",spkTxt:"Which goes first, socks or shoes?",o:[{i:"🧦",l:"Put on Socks"},{i:"👟",l:"Put on Shoes"}],c:0}
],
lifeskills:[
{t:"1. Personal Hygiene",p:"What must Zinzi and Sam do before eating food? 🧼",spkTxt:"What must Zinzi and Sam do before eating food?",o:[{i:"😴",l:"Go Sleep"},{i:"🧼",l:"Wash Hands"}],c:1},
{t:"2. Healthy Living",p:"What did Lindi eat for breakfast to stay strong? 🥣",spkTxt:"What did Lindi eat for breakfast to stay strong?",o:[{i:"🥣",l:"Warm Porridge"},{i:"🍬",l:"Sweet Candy"}],c:0},
{t:"3. Body Awareness",p:"Where did little Ali rub the red paint? 🔴",spkTxt:"Where did little Ali rub the red paint?",o:[{i:"👃",l:"Nose"},{i:"🔴",l:"Tummy"}],c:1},
{t:"4. Outdoor Picnic",p:"What did Nicholas and his family pack food in? 🧺",spkTxt:"What did Nicholas and his family pack food in?",o:[{i:"🎒",l:"School Bag"},{i:"🧺",l:"Picnic Basket"}],c:1},
{t:"5. Classroom Safety",p:"How do we walk safely in the classroom corridor? 🚶🏽‍♂️",spkTxt:"How do we walk safely in the classroom corridor?",o:[{i:"🚶🏽‍♂️",l:"Walk Calmly"},{i:"🏃🏽‍♂️",l:"Run Fast"}],c:0},

});

function tab(id,btn){
var s=document.getElementsByClassName('subject-section'),b=document.getElementsByClassName('tab-btn');
for(var i=0;i<s.length;i++)s[i].classList.remove('active');
for(var j=0;j<b.length;j++)b[j].classList.remove('active');
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}

function switchStory(id,btn){
var panels=document.getElementsByClassName('story-panel'),btns=document.getElementsByClassName('story-tab-btn');

for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}

function chk(btn,isC,id){
var fb=document.getElementById(id+'-fb'),s=btn.parentElement.getElementsByClassName('opt-btn');
for(var i=0;i<s.length;i++)s[i].classList.remove('correct','wrong');
if(isC){
btn.classList.add('correct');
if(fb){fb.className="fb correct";fb.innerHTML="🌟 Excelled! Correct Answer!";}
spk("Excelled! That is correct!");
confetti();
if(btn.getAttribute('data-scored')!=='true'){
stars++;
btn.setAttribute('data-scored','true');
document.getElementById('s-cnt').innerText=stars;
updRank();
}
}else{
btn.classList.add('wrong');
if(fb){fb.className="fb wrong";fb.innerHTML="❌ Try again!";}
spk("Not quite. Try again!");
}
}

function updRank(){
var r=document.getElementById('r-bdg');
if(stars>=50)r.innerText="Safari Master 👑";
else if(stars>=30)r.innerText="Safari Champion 🏆";
else if(stars>=15)r.innerText="Junior Guide 🌿";
else r.innerText="Safari Explorer 🦁";
}

build();
</script>
